# Docs site for the Frappe Research Hub — built by MkDocs Material,
# deployed to GitHub Pages by .github/workflows/docs.yml.
# The markdown files are the hub itself; this file only adds the
# navigation, theme and search on top. No content is duplicated here.

site_name: Frappe & ERPNext Research Hub
site_url: https://irfanzahoor.github.io/frappe-research-hub/
site_description: Learn Frappe Framework and ERPNext from Noob to Pro — guides, research, new apps & real-world use cases.
site_author: Muhammad Irfaan
repo_url: https://github.com/irfanzahoor/frappe-research-hub
repo_name: irfanzahoor/frappe-research-hub
edit_uri: edit/main/
copyright: Copyright &copy; 2026 Muhammad Irfaan

# The site is built from docs/, which scripts/sync-docs.sh copies before
# every build: docs/en/ from the repo root (English) and docs/ur/ from
# i18n/ur/ (Roman Urdu). The markdown in the repo stays the single
# source of truth — docs/ is generated and never committed.
# Files missing in ur/ (CHANGELOG, ROADMAP) fall back to English.
docs_dir: docs

theme:
  name: material
  language: en
  # Template overrides live here (e.g. partials/comments.html for giscus).
  custom_dir: overrides
  # Left-to-right for BOTH languages, like English. Material would
  # otherwise render the `ur` locale right-to-left automatically, but
  # Roman Urdu is Latin script and reads like English.
  direction: ltr
  # Dark blue + white, Irfaan's brand (see stylesheets/extra.css).
  # Light mode by default, with a dark-mode toggle in the header.
  logo: stylesheets/logo.svg
  favicon: stylesheets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

# Page feedback (Material's built-in widget, partials/feedback.html):
# "Was this page helpful?" on every content page. The note on each
# rating links to a pre-filled GitHub Discussion (category "General"),
# so feedback lands in Discussions with no backend. javascripts/
# feedback.js wires the widget until an analytics provider is set —
# Material only wires it from the provider JS, so without this shim
# the form would stay hidden. Once a provider is configured, the
# shim does nothing and Material's own handler takes over.
extra:
  analytics:
    # Analytics (Google Analytics 4) is ready to switch on — it only
    # needs the owner's measurement ID. Uncomment the two lines below
    # and replace G-XXXXXXXXXX with the real ID from Google Analytics
    # (Admin → Data Streams → Web). No ID exists on file yet.
    # provider: google
    # property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks! Tell us what helped in a
            <a href="https://github.com/irfanzahoor/frappe-research-hub/discussions/new?category=general&amp;title=Helpful%3A%20{title}&amp;body=Page%3A%20https%3A%2F%2Firfanzahoor.github.io%2Ffrappe-research-hub{url}%0A%0AWhat%20helped%20you%20on%20this%20page%3F" target="_blank" rel="noopener">discussion</a>.
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks! Tell us what was unclear in a
            <a href="https://github.com/irfanzahoor/frappe-research-hub/discussions/new?category=general&amp;title=Needs%20work%3A%20{title}&amp;body=Page%3A%20https%3A%2F%2Firfanzahoor.github.io%2Ffrappe-research-hub{url}%0A%0AWhat%20was%20unclear%20or%20wrong%20on%20this%20page%3F" target="_blank" rel="noopener">discussion</a>.

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/feedback.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Hooks run from the repo root (config file location), not docs_dir.
hooks:
  - hooks/fix_edit_url.py

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ur
          name: Roman Urdu
          build: true
          # Same feedback widget, in Roman Urdu (replaces
          # extra.analytics wholesale for the ur build).
          extra:
            analytics:
              feedback:
                title: Kya yeh page helpful tha?
                ratings:
                  - icon: material/emoticon-happy-outline
                    name: Yeh page helpful tha
                    data: 1
                    note: >-
                      Shukriya! Batao kya helpful tha — is
                      <a href="https://github.com/irfanzahoor/frappe-research-hub/discussions/new?category=general&amp;title=Helpful%3A%20{title}&amp;body=Page%3A%20https%3A%2F%2Firfanzahoor.github.io%2Ffrappe-research-hub{url}%0A%0AIs%20page%20par%20kya%20helpful%20tha%3F" target="_blank" rel="noopener">discussion</a>
                      mein likho.
                  - icon: material/emoticon-sad-outline
                    name: Is page mein behtari chahiye
                    data: 0
                    note: >-
                      Shukriya! Batao kya unclear tha — is
                      <a href="https://github.com/irfanzahoor/frappe-research-hub/discussions/new?category=general&amp;title=Needs%20work%3A%20{title}&amp;body=Page%3A%20https%3A%2F%2Firfanzahoor.github.io%2Ffrappe-research-hub{url}%0A%0AIs%20page%20par%20kya%20unclear%20ya%20ghalat%20tha%3F" target="_blank" rel="noopener">discussion</a>
                      mein likho.
  # Social cards (Open Graph images, one per page) in the site's
  # navy/gold brand colours. Needs Pillow + cairosvg in .venv-docs
  # (the logo is an SVG). Cards are generated into site/ at build
  # time and deployed with gh-pages — they are not committed.
  - social:
      cards_layout_options:
        background_color: "#0b2a5b"
        color: "#ffffff"
        font_family: Inter

